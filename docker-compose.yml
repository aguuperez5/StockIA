services:
  postgres:
    image: postgres:16-alpine
    container_name: stockia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockia
      POSTGRES_PASSWORD: stockia
      POSTGRES_DB: stockia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockia -d stockia"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5434:5432"
    volumes:
      - stockia-postgres-data:/var/lib/postgresql/data

  ai:
    profiles: ["ai"]
    build:
      context: ./ai
      args:
        INSTALL_OCR: ${STOCKIA_INSTALL_OCR:-false}
    environment:
      STOCKIA_AI_HOST: 0.0.0.0
      STOCKIA_AI_PORT: "8010"
      STOCKIA_AI_SHARED_TOKEN: ${AI_SERVICE_TOKEN:-}
    ports:
      - "127.0.0.1:8010:8010"
    restart: unless-stopped

volumes:
  stockia-postgres-data:
