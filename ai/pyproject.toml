[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockia-ai"
version = "0.1.0"
description = "Local product-image perception service for StockIA"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115.4,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "numpy>=2.1,<3",
  "opencv-python>=4.10,<5",
  "Pillow>=11,<13",
  "zxing-cpp>=2.2,<3",
  "python-dotenv>=1,<2",
  "certifi>=2025",
]

[project.optional-dependencies]
ocr = ["paddleocr>=3,<4"]
ocr-local = ["rapidocr-onnxruntime==1.4.4"]
test = ["httpx>=0.27,<1", "httpx2>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
